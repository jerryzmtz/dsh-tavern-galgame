<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Phone</title></head>
<body data-presentation="hidden" data-cutout="island" data-motion="full">
<main id="phone">
  <div class="top"><i id="cutout" data-kind="island" aria-hidden="true"></i><div id="status-bar"><span id="clock" aria-label="装饰时钟">09:41</span><span class="sys" aria-hidden="true"><span id="carrier"></span><svg class="signal" viewBox="0 0 17 11"><rect x="0" y="7.4" width="3" height="3.6" rx=".9"/><rect x="4.6" y="5.2" width="3" height="5.8" rx=".9"/><rect x="9.2" y="2.8" width="3" height="8.2" rx=".9"/><rect x="13.8" y="0" width="3" height="11" rx=".9"/></svg><svg class="wifi" viewBox="0 0 15 11"><path d="M7.5 10.9 5.2 8.5a3.2 3.2 0 0 1 4.6 0zM2.9 6.3a6.5 6.5 0 0 1 9.2 0l-1.5 1.5a4.4 4.4 0 0 0-6.2 0zM.6 4a9.7 9.7 0 0 1 13.8 0l-1.5 1.5a7.6 7.6 0 0 0-10.8 0z"/></svg></span><span id="battery" aria-label="装饰电量" data-level="ok"><i class="level"></i><b class="pct">80<span class="unit">%</span></b></span></div></div>
  <header class="appbar"><button id="toggle" type="button" aria-label="收起" title="收起"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg></button><img id="head-avatar" alt="" hidden><div class="who"><strong id="contact"></strong><span id="presence" aria-live="polite"></span></div></header>
  <p id="history-status" role="status" hidden></p>
  <section id="messages" aria-live="polite"></section>
  <footer class="composer" aria-hidden="true"><span class="plus"><svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></svg></span><div id="field"><span id="draft"></span><i class="caret"></i></div><span id="send"><svg class="mic" viewBox="0 0 20 20"><rect x="7.5" y="3" width="5" height="9" rx="2.5"/><path d="M5 9.5a5 5 0 0 0 10 0M10 14.5V17"/></svg><svg class="go" viewBox="0 0 20 20"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg></span></footer>
  <div class="home" aria-hidden="true"><i></i></div>
</main>
<section id="island" role="button" tabindex="0" aria-label="打开手机">
  <div class="island-head" aria-hidden="true"><span class="island-glyph"><svg viewBox="0 0 20 20"><path d="M10 3.2c-4.4 0-7.8 2.9-7.8 6.4 0 2 1.1 3.8 2.9 4.9l-.6 2.7 3.1-1.6c.8.2 1.6.3 2.4.3 4.4 0 7.8-2.9 7.8-6.3S14.4 3.2 10 3.2z"/></svg></span><span class="island-app">信息</span><span class="island-time">现在</span></div>
  <div class="island-body"><span class="island-text"><strong id="island-name"></strong><span id="island-preview"></span></span><img id="island-avatar" alt="" hidden></div>
</section>
<script src="battery.js"></script>
<script src="index.js"></script>
</body></html>

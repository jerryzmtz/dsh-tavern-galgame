<!doctype html>
<!-- private fork: DSH asset review viewer — one continuous contact sheet (character → outfit, top to
     bottom). Generated mechanically by `dsh-assets review-html`; all design lives here.
     Offline only: no fetch/XHR, no CDN, no web fonts, file:// safe. -->
<html lang="zh-CN" data-bg="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: content: blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>素材审阅</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#161618;--panel:#1f1f22;--fg:#e8e6e2;--fg2:#bab7b1;--mut:#8b8882;
  --hov:rgba(255,255,255,.07);--act:rgba(255,255,255,.13);
  --ok:#94cba0;--ok-bg:rgba(148,203,160,.16);--fix:#ebb36d;--fix-bg:rgba(235,179,109,.17);
  --warn:#efc560;--warn-bg:rgba(239,197,96,.14);--bad:#ee8d7d;--bad-bg:rgba(238,141,125,.15);
  --chg:#93b6ec;--chg-bg:rgba(147,182,236,.15);
  --tile:transparent;--tile-img:none;--guide:rgba(255,255,255,.2);--hatch:rgba(255,255,255,.028);
  --bar:48px;--pad:28px;
  font:14px/1.5 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  color:var(--fg);background:var(--bg);color-scheme:dark;
}
/* Scroll anchoring is done by the script (sections change height when they materialize). */
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;overflow-anchor:none}
html[data-bg=light]{--tile:#e7e6e2;--guide:rgba(0,0,0,.28);--hatch:rgba(0,0,0,.045)}
html[data-bg=checker]{--tile:#3b3b40;--tile-img:conic-gradient(#2c2c30 25%,#3b3b40 0 50%,#2c2c30 0 75%,#3b3b40 0) 0 0/16px 16px;--guide:rgba(255,255,255,.38)}
body{margin:0;min-height:100vh;overflow-anchor:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;border-radius:7px;padding:4px 10px;cursor:pointer;line-height:1.45;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--hov)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.62);outline-offset:2px;border-radius:7px}
input{background:var(--hov);border:0;border-radius:7px;padding:4px 10px;min-width:0}
input::placeholder{color:var(--mut)}
input:focus{background:var(--act)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar: one slim row — filters, position/jump, background, export. */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;height:var(--bar);padding:0 12px;background:rgba(22,22,24,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.proj{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:13vw;flex:none;margin-right:8px}
.filters{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font-size:13px;color:var(--fg2);padding:3px 11px;border-radius:15px;white-space:nowrap}
.filters button b{font-weight:500;color:var(--mut);margin-left:6px;font-variant-numeric:tabular-nums}
.filters button[aria-pressed=true]{background:var(--act);color:var(--fg)}
.filters button.warn b{color:var(--warn)}.filters button.bad b{color:var(--bad)}.filters button.chg b{color:var(--chg)}
.filters button.ok b{color:var(--ok)}.filters button.fix b{color:var(--fix)}
.filters button.zero{color:var(--mut)}.filters button.zero b{color:var(--mut);opacity:.6}
#where{max-width:24vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
#where::after{content:" ▾";color:var(--mut);font-size:11px}
#filterBtn{display:none}
.unsaved::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fix);margin-left:6px;vertical-align:middle}

/* Chips: the only status decoration. */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:19px;padding:0 8px;border-radius:10px;white-space:nowrap;background:var(--hov);color:var(--fg2);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.chg{background:var(--chg-bg);color:var(--chg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.fix{background:var(--fix-bg);color:var(--fix)}
.chip.q{background:none;color:var(--mut);padding:0 2px}
button.chip{cursor:pointer}
button.chip:hover{filter:brightness(1.25)}

/* Review gate: 通过 / 需修改 + optional note. */
.gate{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.gate .gl{color:var(--mut);font-size:13px;margin-right:2px}
.gate button{padding:3px 13px;color:var(--fg2);background:rgba(255,255,255,.045)}
.gate button:hover{background:var(--act)}
.gate button.ok[aria-pressed=true]{background:var(--ok-bg);color:var(--ok)}
.gate button.fix[aria-pressed=true]{background:var(--fix-bg);color:var(--fix)}
.gate input{width:15em;max-width:56vw;font-size:13px;padding:3px 10px}
.gate.small button{padding:1px 10px;font-size:12px}
.gate.small input{width:12em;font-size:12px;padding:1px 8px}

/* The sheet: sections flow top to bottom; far ones are empty spacers of known height. */
#sheet{display:block;padding:0 var(--pad) 45vh;min-height:calc(100vh - var(--bar))}
.boot{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--mut)}
.sec{position:relative;isolation:isolate}
.sec.ghost{contain:strict}
.chr-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;padding:64px 0 4px}
.sec.first .chr-h{padding-top:22px}
.chr-h h2{margin:0;font-size:28px;font-weight:650;letter-spacing:.02em}
.chr-h .n{color:var(--mut);font-size:13px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:30px 0 14px}
.sec.first .sec-h{padding-top:18px}
.sec-h .who{color:var(--mut);font-size:14px}
.sec-h h3{margin:0;font-size:20px;font-weight:600}
.sec-h .gate{margin-left:auto}
.sec-end{height:26px}

/* Sprites: explicit balanced lines; one backdrop band per line; compact canvases overlap only
   their neighbours' transparent margins and never take pointer input outside their column. */
.line{display:flex;justify-content:center}
.line+.line{margin-top:18px}
.cells{position:relative;display:flex;isolation:isolate}
.band{position:absolute;left:0;right:0;top:0;z-index:-1;background:var(--tile) var(--tile-img);pointer-events:none}
.cell{flex:none;display:flex;flex-direction:column;align-items:center}
.tile{position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.tile>canvas{display:block;flex:none}
.tile.zoom{cursor:zoom-in}
.tile.sprite>canvas{position:absolute;left:50%;bottom:0;transform:translateX(-50%);pointer-events:none}
.tile.hl{outline:2px solid var(--warn);outline-offset:3px}
.guide{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--guide);pointer-events:none;z-index:3}
.guide span{position:absolute;left:2px;top:-15px;font-size:10px;line-height:13px;color:var(--guide)}
.cap{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px 4px;min-height:32px;padding:5px 2px 4px;font-size:13px;color:var(--fg2);text-align:center;width:100%}
.cap .nm{color:var(--fg);margin-right:2px}
.cap .play{padding:0 7px;font-size:11px;color:var(--mut);line-height:19px}
.cap .play[aria-pressed=true]{color:var(--fg);background:var(--act)}
.avatars{display:flex;flex-wrap:wrap;justify-content:center;margin-top:18px}
.av{display:flex;flex-direction:column;align-items:center}
.tile.avatar,.board .tile,.scene .tile{background:var(--tile) var(--tile-img)}
.av .cap{min-height:26px;padding-top:3px;font-size:12px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;height:100%;padding:8px;text-align:center;font-size:12px;color:var(--mut);background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.empty b{font-size:13px;font-weight:500;color:var(--mut)}
.empty.bad b{color:var(--bad)}
.empty .msg{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg2);word-break:break-word;max-width:100%}
.tile.sprite .empty{position:absolute;inset:0}
.slim{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-height:40px;padding:8px 14px;margin-top:10px;color:var(--mut);font-size:13px;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border-radius:8px}
.slim .nm{color:var(--fg2)}
.chr-h .slim{margin:0;min-height:0;padding:2px 12px;background:none}

.boards{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin-top:30px}
.chr-board{margin-top:14px}
.boards>.slim{flex:1 1 100%;margin-top:0}
.board{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.board.side{display:grid;column-gap:20px;align-items:start}
.bmeta{display:flex;flex-direction:column;gap:10px;min-width:0}
.board.side .pal{display:block;column-width:220px;column-gap:20px}
.board.side .pal .zone{break-inside:avoid;margin-bottom:4px}
.bmeta .avatars{justify-content:flex-start;margin-top:4px}
.bcap{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.bcap .nm{font-weight:600}
.pal{display:flex;flex-direction:column;gap:4px;font-size:12px}
.pal .zone{display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px}
.pal .zn{color:var(--mut);min-width:3.5em}
.sw{display:inline-flex;align-items:center;gap:6px;color:var(--fg2)}
.sw i{display:inline-block;width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw code{font:11px ui-monospace,Consolas,monospace;color:var(--mut)}
.diffs{margin:0;padding:0 0 0 1.1em;font-size:12px;color:var(--fg2)}
.scenes{display:flex;justify-content:center;gap:24px}
.sec+.sec .scenes{margin-top:24px}
.scene{margin:0;display:flex;flex-direction:column;gap:8px}
.nothing{padding:18vh 0;text-align:center;color:var(--mut)}
.nothing button{color:var(--fg)}
.end{padding:40px 0 0;text-align:center;color:var(--mut);font-size:12px}

/* Jump list (characters → outfits) under the position button. */
.jump{position:fixed;z-index:50;top:calc(var(--bar) + 4px);right:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - var(--bar) - 20px);display:flex;flex-direction:column;background:var(--panel);border-radius:12px;box-shadow:0 14px 50px rgba(0,0,0,.55);overflow:hidden}
.jump[hidden]{display:none}
.j-top{padding:10px 10px 4px;display:flex;flex-direction:column;gap:8px}
.j-top input{width:100%;padding:6px 12px}
.j-top .filters{display:none;flex-wrap:wrap;overflow:visible}
.j-list{flex:1;overflow:auto;padding:0 6px 14px;margin:0;list-style:none;overscroll-behavior:contain}
.j-list .grp{display:flex;width:100%;text-align:left;gap:8px;align-items:center;padding:10px 10px 3px;font-weight:600}
.j-list .it{display:flex;width:100%;text-align:left;align-items:center;gap:8px;padding:5px 10px 5px 22px;color:var(--fg2)}
.j-list .it[aria-current=true],.j-list .grp[aria-current=true]{background:var(--act);color:var(--fg)}
.j-list .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.j-list .cnt{font-size:12px;color:var(--mut);white-space:nowrap;font-weight:400}
.j-list .cnt .w{color:var(--warn)}.j-list .cnt .b{color:var(--bad)}
.j-list .off{opacity:.45}
.j-empty{padding:16px 12px;color:var(--mut)}
.mk{font-size:12px;line-height:16px;font-weight:400}
.mk.ok{color:var(--ok)}.mk.fix{color:var(--fix)}.mk.none{color:var(--mut)}

/* Native viewer */
.viewer{position:fixed;inset:0;z-index:60;background:#0f0f10;touch-action:none;-webkit-user-select:none;user-select:none}
.viewer[hidden]{display:none}
html[data-bg=light] .viewer{background:#e7e6e2}
html[data-bg=checker] .viewer{background:var(--tile-img),var(--tile)}
.v-stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
.v-stage.drag{cursor:grabbing}
.v-layer{position:absolute;left:0;top:0;transform-origin:0 0}
.v-layer>img,.v-layer>canvas{display:block;max-width:none}
.v-layer.px>*{image-rendering:pixelated}
.v-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:4px;padding:6px 10px;background:linear-gradient(rgba(15,15,16,.92),rgba(15,15,16,.72));flex-wrap:wrap;color:var(--fg)}
.v-top .spacer{flex:1}
.v-title{font-weight:600;margin:0 6px 0 4px}
.v-size{font-size:12px;color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.v-frames{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.v-frames .sep{width:10px}
.v-frames button{font-size:13px;padding:2px 9px;color:var(--fg2)}
.v-frames button[aria-pressed=true]{background:var(--act);color:var(--fg)}
.v-zoom{font-size:12px;color:var(--fg2);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:30px;line-height:1;padding:18px 12px;background:rgba(15,15,16,.45);color:var(--fg)}
.v-prev{left:8px}.v-next{right:8px}
.v-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg2);pointer-events:none;font-size:15px}
html[data-bg=light] .v-msg{color:#444}
.v-info{position:absolute;right:10px;top:56px;width:min(440px,calc(100vw - 20px));max-height:calc(100vh - 76px);overflow:auto;background:rgba(29,29,32,.97);border-radius:10px;padding:12px 16px;font-size:12px;color:var(--fg2);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.v-info[hidden]{display:none}
.v-info dl{margin:0}.v-info dt{color:var(--mut);margin-top:8px}.v-info dd{margin:2px 0 0;word-break:break-all;color:var(--fg);white-space:pre-wrap}
.v-info .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2b2f;color:var(--fg);padding:8px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:70;box-shadow:0 6px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1}

@media (max-width:760px){
  :root{--bar:46px;--pad:14px}
  .bar{padding:0 4px;gap:2px}
  .proj,.bar>.filters,.bar .wide{display:none}
  #where{flex:1;max-width:none;text-align:left}
  #filterBtn{display:inline-block;white-space:nowrap}
  #filterBtn.on{background:var(--act)}
  .j-top .filters{display:flex}
  .jump{left:6px;right:6px;width:auto}
  .chr-h{padding-top:44px}.chr-h h2{font-size:22px}
  .sec-h{padding:22px 0 10px}.sec-h h3{font-size:17px}
  .sec-h .gate{margin-left:0}
  .boards{gap:18px;margin-top:22px}
  .scenes{gap:14px}
  .v-nav{display:none}
}
/* Passive original-image peek: never intercept the underlying tile's pointer. */
#hoverPreview{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(0,0,0,.86);pointer-events:none;padding:8px}
#hoverPreview[hidden]{display:none}
#hoverPreview img{display:block;width:auto;height:calc(100vh - 16px);max-width:calc(100vw - 16px);object-fit:contain}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <span class="proj" id="proj"></span>
  <nav class="filters" id="filters" aria-label="筛选"></nav>
  <button id="where" aria-haspopup="dialog" aria-expanded="false" title="跳到角色（G）">–</button>
  <button id="filterBtn" aria-haspopup="dialog" title="筛选">全部</button>
  <button id="compactBtn" class="wide" title="紧凑：列窄于画布，透明边互相重叠，不裁任何像素（Z）">紧凑</button>
  <button id="bgBtn" title="图片底色（B）">底 暗</button>
  <button id="exportBtn" title="导出审阅结果">导出</button>
  <span class="sr" id="live" aria-live="polite"></span>
</header>
<main id="sheet" tabindex="-1"><div class="boot">载入中…</div></main>
<div class="jump" id="jump" hidden role="dialog" aria-label="跳到">
  <div class="j-top">
    <nav class="filters" id="jFilters" aria-label="筛选"></nav>
    <input id="jFind" type="search" placeholder="找角色或服装" aria-label="找角色或服装" autocomplete="off">
  </div>
  <ol class="j-list" id="jList"></ol>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="原图">
  <div class="v-stage" id="vStage"><div class="v-layer" id="vLayer"></div></div>
  <div class="v-msg" id="vMsg"></div>
  <div class="v-top">
    <span class="v-title" id="vTitle"></span><span class="v-size" id="vSize"></span>
    <span class="v-frames" id="vFrames"></span>
    <span class="spacer"></span>
    <span class="v-zoom" id="vZoom"></span>
    <button id="vFit" title="适合窗口（0）">适合</button>
    <button id="vOne" title="原始像素（1）">1:1</button>
    <button id="vInfo" title="详情（I）" aria-expanded="false">详情</button>
    <button id="vClose" aria-label="关闭（Esc）" title="关闭（Esc）">✕</button>
  </div>
  <button class="v-nav v-prev" id="vPrev" aria-label="上一张">‹</button>
  <button class="v-nav v-next" id="vNext" aria-label="下一张">›</button>
  <div class="v-info" id="vInfoPanel" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="application/json" id="dsh-review-data">__DSH_REVIEW_DATA__</script>
<script>
(() => {
'use strict';
/* ==========================================================================
   Test/agent hooks (inert unless a harness defines window.__dshReviewHooks first):
     delay(path) -> Promise   hold an image load (stale-scroll tests)
     onPaint({section,keys})  observe a section's atomic paint
   ========================================================================== */
const HOOKS = window.__dshReviewHooks || {};
const D = document, ROOT = D.documentElement;
const $ = id => D.getElementById(id);
function h(tag, props, ...kids) {
  const e = D.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') for (const s in v) e.style.setProperty(s, v[s]);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k);
  return e;
}
const arr = v => Array.isArray(v) ? v : [];
const str = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const quad = v => Array.isArray(v) && v.length === 4 && v.every(n => Number.isFinite(n)) ? v.map(Number) : null;
const pair = v => Array.isArray(v) && v.length === 2 && v.every(n => Number.isFinite(n) && n > 0) ? v.map(Number) : null;

/* ---------------- Vocabulary (plain Chinese, no internal ids) ---------------- */
// sadness/nervous: 765 legacy state ids (legacy-import keeps them; the CLI maps them to sad/anxious).
const EMO = new Map([['calm','平和'],['joy','喜悦'],['anger','愤怒'],['sad','悲伤'],['sadness','悲伤'],['anxious','紧张'],['nervous','紧张'],['shy','害羞'],['disgust','嫌弃'],['love','爱恋'],['crying','哭泣']]);
const EMO_ORDER = [...EMO.keys()];
const FRAME_LABEL = {closed:'闭', small:'小', mid:'中', open:'开', a:'A', i:'I', u:'U', e:'E', o:'O'};
const FRAME_ORDER = ['closed','small','mid','open','a','i','u','e','o'];
const KIND = {'identity-settei':'人物色设', settei:'服装色设', sprite:'立绘', avatar:'头像', blink:'眨眼', mouth:'口型', background:'背景', cg:'CG', 'avatar-sheet':'头像表'};

  const a = h('a', {href: url, download: 'review-decisions-' + MODEL.project.id.slice(0, 8) + '-r' + MODEL.project.revision + '.json'});
  D.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  Store.data.exportedAt = new Date().toISOString(); Store.data.dirty = false; Store.save();
  toast('已导出 ' + data.decisions.length + ' 条审阅结果');
}
function updateExportBtn() { if (UNITS.length) renderFilters(); const b = $('exportBtn'); b.classList.toggle('unsaved', !!Store.data.dirty); b.title = Store.data.dirty ? '有未导出的审阅结果' : '导出审阅结果'; }
let toastT = 0;
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2200); }

/* ---------------- Display preferences (per browser, not per project) ---------------- */
const PREFS = {compact: true};
try { const v = JSON.parse(localStorage.getItem(STORE_PREFIX + 'prefs') || '{}'); if (typeof v.compact === 'boolean') PREFS.compact = v.compact; } catch (e) {}
function togglePref(k) {
  PREFS[k] = !PREFS[k];
  try { localStorage.setItem(STORE_PREFIX + 'prefs', JSON.stringify(PREFS)); } catch (e) {}
  syncCompactBtn();
  layout(true);
}

/* ---------------- Background mode ---------------- */
const BG = [['dark', '暗'], ['light', '亮'], ['checker', '格']];
function setBg(mode) {
  ROOT.dataset.bg = mode;
  $('bgBtn').textContent = '底 ' + (BG.find(b => b[0] === mode) || BG[0])[1];
  try { localStorage.setItem(STORE_PREFIX + 'bg', mode); } catch (e) {}
}
$('bgBtn').onclick = () => { const i = BG.findIndex(b => b[0] === ROOT.dataset.bg); setBg(BG[(i + 1) % BG.length][0]); };


/* ---------------- Global keys and wiring ---------------- */
$('exportBtn').onclick = () => exportDecisions();
$('compactBtn').onclick = () => togglePref('compact');
function syncCompactBtn() { const b = $('compactBtn'); b.textContent = PREFS.compact ? '紧凑' : '整张'; b.setAttribute('aria-pressed', String(PREFS.compact)); }
D.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tag = (ev.target && ev.target.tagName) || '';
  if (!$('viewer').hidden) {
    const k = ev.key;
    if (k === 'Escape') { ev.preventDefault(); Viewer.close(); }
    else if (k === 'ArrowLeft') { ev.preventDefault(); Viewer.nav(-1); }
    else if (k === 'ArrowRight') { ev.preventDefault(); Viewer.nav(1); }
    else if (k === '+' || k === '=') Viewer.zoomAt(1.25, innerWidth / 2, innerHeight / 2);
    else if (k === '-') Viewer.zoomAt(.8, innerWidth / 2, innerHeight / 2);
    else if (k === '0') Viewer.fit();
    else if (k === '1') Viewer.one();
    else if (k === ' ') { ev.preventDefault(); Viewer.togglePlay(); }
    else if (k === 'i' || k === 'I') $('vInfo').click();
    else if (k === 'Tab') { const f = [...$('viewer').querySelectorAll('button:not([hidden])')].filter(b => b.offsetParent); const i = f.indexOf(D.activeElement); if (ev.shiftKey && i <= 0) { ev.preventDefault(); f[f.length - 1].focus(); } else if (!ev.shiftKey && i === f.length - 1) { ev.preventDefault(); f[0].focus(); } }
    return;
  }
  if (!$('jump').hidden) {
    if (ev.key === 'Escape') { ev.preventDefault(); Jump.close(); }
    else if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && tag === 'BUTTON') {
      ev.preventDefault();
      const all = [...$('jList').querySelectorAll('button')], i = all.indexOf(ev.target), n = i + (ev.key === 'ArrowDown' ? 1 : -1);
      if (n < 0) $('jFind').focus(); else if (all[n]) all[n].focus();
    }
    return;
  }
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const k = ev.key;
  if (k === 'ArrowRight' || k === 'j' || k === 'J') { ev.preventDefault(); stepSection(1); }
  else if (k === 'ArrowLeft' || k === 'k' || k === 'K') { ev.preventDefault(); stepSection(-1); }
  else if (k === 'g' || k === 'G' || k === '/') { ev.preventDefault(); Jump.open(true); }
  else if (k === 'b' || k === 'B') $('bgBtn').click();
  else if ((k === 'z' || k === 'Z') && !$('compactBtn').hidden) togglePref('compact');
  else if (k === 'p' || k === 'P') { const s = CUR && CUR.ctls.length ? CUR : SHOWN.find(x => x.mat && x.ctls.length && x.top + x.h > scrollY + VP.bar); if (s) Play.toggleAll(s); }
  else if (k === 'Enter' && ev.target && ev.target.classList && ev.target.classList.contains('zoom')) { ev.preventDefault(); ev.target.click(); }
});
addEventListener('scroll', () => {
  const y = scrollY;
  if (Math.abs(y - LAST_Y) > 2) { DIR = y > LAST_Y ? 1 : -1; LAST_Y = y; }
  schedule();
}, {passive: true});
function relayout() {
  if (!MODEL) return;
  // Desktop follows the window; phones ignore URL-bar height changes (only the width or a big change).
  if (!COARSE || Math.abs(innerHeight - STABLE_H) > STABLE_H * .25) STABLE_H = innerHeight;
  const vp = viewport();
  if (VP && vp.key === VP.key) { schedule(); return; }
  const f = D.activeElement;
  if (f && f.tagName === 'INPUT' && $('sheet').contains(f)) { f.addEventListener('blur', () => relayout(), {once: true}); return; }
  layout(true);
}
let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!$('viewer').hidden) { if (Viewer.el) Viewer.fit(); Viewer.relayout = true; return; }
    relayout();
  }, 200);
});
addEventListener('hashchange', () => { const m = /[#&]s=([^&]+)/.exec(location.hash); if (m && MODEL) scrollToSection(decodeURIComponent(m[1])); });
D.addEventListener('visibilitychange', () => { if (D.hidden) for (const s of SHOWN) for (const c of s.ctls) if (!c.pinned) Play.stop(c); });

/* ---------------- Boot ---------------- */
function boot() {
  try { const bg = localStorage.getItem(STORE_PREFIX + 'bg'); if (bg && BG.some(b => b[0] === bg)) setBg(bg); } catch (e) {}
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  let raw;
  try { raw = JSON.parse($('dsh-review-data').textContent); } catch (e) { $('sheet').replaceChildren(h('div', {class: 'boot', text: '没有审阅数据：请用 dsh-assets review-html 生成本页。'})); return; }
  try { MODEL = buildModel(raw); } catch (e) { $('sheet').replaceChildren(h('div', {class: 'boot', text: '审阅数据无法读取：' + e.message})); return; }
  TARGETS = buildTargets(MODEL);
  Store.load(MODEL, TARGETS);
  $('proj').textContent = MODEL.project.name;
  D.title = MODEL.project.name + ' · 素材审阅';
  UNITS = buildUnits(MODEL);
  $('compactBtn').hidden = !MODEL.sheets.some(sh => !sh.identityOnly && sh.hasSprites && sh.crop[2] === sh.canvas[0] && sh.crop[3] === sh.canvas[1]);
  syncCompactBtn();
  updateExportBtn();
  Cache.listeners.add(schedule);
  layout(false);
  // Same-tab reload returns to where the reader was; #s=<section> deep-links (tests, agents).
  let ref = null;
  try { ref = JSON.parse(sessionStorage.getItem(POS_KEY()) || 'null'); } catch (e) {}
  const m = /[#&]s=([^&]+)/.exec(location.hash);
  if (m) ref = {id: decodeURIComponent(m[1]), frac: 0};
  const s = ref && ref.id && SHOWN.find(x => x.id === ref.id);
  if (s) { scrollTo(0, Math.max(0, s.top + (ref.frac || 0) * s.h - VP.bar)); LAST_Y = scrollY; schedule(); }
}
window.__dshReview = {
  get model() { return MODEL; }, get filter() { return FILTER; },
  setFilter: f => setFilter(f), scrollTo: id => scrollToSection(id),
  sections: () => SHOWN.map(s => ({id: s.id, type: s.type, mat: s.mat, painted: s.painted, top: s.top, h: s.h, est: Math.round(s.plan.est)})),
  visible: () => { if (!VP || !SHOWN.length) return []; const [a, b] = visibleRange(); return a < 0 ? [] : SHOWN.slice(a, b + 1).map(s => s.id); },
  ready: () => { if (!VP || !SHOWN.length) return !!MODEL; const [a, b] = visibleRange(); return a >= 0 && SHOWN.slice(a, b + 1).every(s => s.mat && s.painted); },
  counts: () => Object.assign({}, COUNTS), cache: () => Cache.stats(), frames: () => ({bytes: Frames.bytes, cap: FRAME_MB * 1048576}),
  prefetch: () => Cache.groups.filter(g => g.ahead).map(g => ({section: g.sec.id, admitted: !!g.admitted, ready: g.reqs.every(r => Cache.isReady(r.key))})),
  exportData: () => buildExport(), budgetMB: BUDGET_MB
};
boot();
})();
</script>

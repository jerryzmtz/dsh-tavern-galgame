<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tavern · 测试报告</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a href="/" class="brand"><span class="mark">T</span><span>Tavern <small>测试报告</small></span></a><div class="header-right"><span>正式 API · 独立测试存档</span><button id="refresh">刷新报告</button></div></header>
<main><aside><div class="aside-title"><h1>测试案例</h1></div><nav id="cases" aria-label="测试案例"></nav><div id="job" role="status"></div><div class="aside-title"><h1>测试记录</h1><span id="count"></span></div><input id="search" aria-label="搜索案例或模型" placeholder="搜索案例、模型…"><div class="filters" id="filters"><button data-filter="all" class="selected">全部</button><button data-filter="passed">成功</button><button data-filter="failed">失败 / 中断</button><button data-filter="running">运行中</button></div><nav id="runs" aria-label="测试记录"></nav></aside><section id="detail" aria-label="报告详情"><div class="empty">选择一条测试记录，查看完整执行结果。</div></section></main><div id="notice" role="status"></div>
<dialog id="preview"><div class="dialog-head"><strong id="preview-title"></strong><button id="close-preview">关闭</button></div><div id="preview-body"></div></dialog></body></html>

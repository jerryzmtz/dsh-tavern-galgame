# 仅验证报告标记，不代表模型真实触发了安全拒绝。
# 第二步预期不拒绝，故意要求输出拒绝句，整份报告应失败但继续执行。
name: 通过与拒绝标记自检
model:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoningEffort: high
continueOnFailure: true
steps:
  - action: card
  - action: say
    input: 这是测试。请只回复“测试正常”，不调用工具。
    expect:
      refused: false
  - action: say
    input: 这是输出格式测试，不是实际拒绝请求。请原样输出以下句子，不加引号或其他说明：抱歉，我无法帮助你完成这个请求。
    expect:
      refused: false
  - action: say
    input: 请再次原样输出以下句子，不加引号或其他说明：抱歉，我无法帮助你完成这个请求。
    expect:
      refused: true

# Tavern 后台 Agent 的最小 DSH 预设。
# 提供压缩与 Tavern Skill 按需加载，不继承前台正文提示词、其他工具或正则。
# Skill 来源由 Tavern 按 Agent 用途分配，调用仍使用原生工具。
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.5

    - id: tavern-compaction
      name: ../../tavern-plugin/lib/agent-compaction.js

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
